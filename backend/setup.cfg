[flake8]
# Flake8 configuration for RAG Query Backend
# Aligns with Constitution Rule I (Code Quality & Standards)

# Maximum line length (matches Black configuration)
max-line-length = 100

# Exclude directories from linting
exclude =
    .git,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    .venv,
    venv,
    env,
    dist,
    build,
    *.egg-info,
    .eggs,
    htmlcov,
    .coverage

# Error codes to ignore
ignore =
    # E203: whitespace before ':' (conflicts with Black)
    E203,
    # E501: line too long (handled by Black)
    E501,
    # W503: line break before binary operator (conflicts with Black)
    W503,
    # E266: too many leading '#' for block comment
    E266,
    # E402: module level import not at top of file (sometimes needed for type checking)
    E402

# Enable additional checks
select = E,W,F,C,N

# Maximum cyclomatic complexity (recommended: 10-15)
max-complexity = 10

# Per-file ignores
per-file-ignores =
    # __init__.py files can have unused imports (re-exports)
    __init__.py:F401,F403
    # Test files can have longer lines and unused imports
    tests/*:E501,F401,F811

# Show source code for each error
show-source = True

# Show pep8 violation statistics
statistics = True

# Count errors and warnings
count = True

# Enable all pycodestyle warnings
doctests = True

# Treat all warnings as errors (strict mode)
# Uncomment to enforce zero warnings
# max-warnings = 0
